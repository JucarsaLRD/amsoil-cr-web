<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AMSOIL Costa Rica | En Construcción</title>
    <meta name="description" content="Sitio oficial de AMSOIL Costa Rica (American Lubricants Supply S.A.). Próximamente disponible.">
    <meta name="theme-color" content="#0F1416">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root {
            --amsoil-red: #CC262F;
            --amsoil-blue: #004B87;
            --amsoil-dark: #0F1416;
            --amsoil-charcoal: #1C2329;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            background-color: var(--amsoil-dark);
            overflow-x: hidden;
            touch-action: pan-y;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-image: 
                radial-gradient(circle at 50% 15%, rgba(0, 75, 135, 0.16) 0%, transparent 65%),
                radial-gradient(circle at 50% 85%, rgba(204, 38, 47, 0.12) 0%, transparent 65%),
                linear-gradient(180deg, #0F1416 0%, #080A0C 100%);
        }

        /* CONTENEDOR FULL-WIDTH RESPONSIVO (EDGE TO EDGE) */
        .responsive-stage {
            width: 100%;
            max-width: 100vw;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .showcase-picture {
            width: 100%;
            display: block;
        }

        .showcase-img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            vertical-align: middle;
        }

        /* OPTIMIZACIONES PARA MÓVILES (IPHONE / ANDROID) */
        @media (max-width: 768px) {
            body {
                justify-content: flex-start;
                padding-top: env(safe-area-inset-top, 0px);
                padding-bottom: env(safe-area-inset-bottom, 0px);
            }
            .responsive-stage {
                min-height: 100dvh;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <main class="responsive-stage">
        <picture class="showcase-picture">
            <!-- VERSIÓN MÓVIL: iPhone / Android (pantallas hasta 768px) -->
            <source media="(max-width: 768px)" srcset="assets/banners/amsoil-cr-mobile-en-construccion.jpg?v=9">
            <!-- VERSIÓN ESCRITORIO / TABLETS (pantallas mayores a 768px) -->
            <img 
                src="assets/banners/amsoil-cr-completo-en-construccion.jpg?v=9" 
                alt="AMSOIL Costa Rica - En Construcción"
                class="showcase-img"
                width="1920"
                height="1580"
                loading="eager"
            >
        </picture>
    </main>

</body>
</html>
