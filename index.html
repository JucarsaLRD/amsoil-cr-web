<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AMSOIL Costa Rica | En Construcción</title>
    <meta name="description" content="Sitio oficial de AMSOIL Costa Rica — American Lubricants Supply S.A. Próximamente disponible.">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="assets/logos/amsoil-insignia.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        /* ==========================================================================
           PALETA CORPORATIVA OFICIAL — AMSOIL INC. BRAND STYLE GUIDE (PÁG. 25)
           ========================================================================== */
        :root {
            --amsoil-blue: #005BAA;      /* Pantone 286 | RGB(0, 91, 170) */
            --amsoil-red: #ED1C24;       /* Pantone 485 | RGB(237, 28, 36) */
            --amsoil-gray: #BCBEC0;      /* Pantone Cool Gray 6 | RGB(188, 190, 192) */
            --amsoil-black: #000000;     /* Process Black | RGB(0, 0, 0) */
            --amsoil-white: #FFFFFF;     /* Pure White | RGB(255, 255, 255) */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            background-color: var(--amsoil-black);
            color: var(--amsoil-white);
            font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow-x: hidden;
            touch-action: pan-y;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: var(--amsoil-black);
        }

        /* CONTENEDOR FULL-WIDTH RESPONSIVO (EDGE TO EDGE) */
        .responsive-stage {
            width: 100%;
            max-width: 100vw;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .showcase-picture {
            width: 100%;
            display: block;
        }

        .showcase-img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            vertical-align: middle;
        }

        /* OPTIMIZACIONES PARA MÓVILES (IPHONE / ANDROID) */
        @media (max-width: 768px) {
            body {
                justify-content: flex-start;
                padding-top: env(safe-area-inset-top, 0px);
                padding-bottom: env(safe-area-inset-bottom, 0px);
            }
            .responsive-stage {
                min-height: 100dvh;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <main class="responsive-stage">
        <picture class="showcase-picture">
            <!-- VERSIÓN MÓVIL: iPhone / Android (pantallas hasta 768px) -->
            <source media="(max-width: 768px)" srcset="assets/banners/amsoil-cr-mobile-en-construccion.jpg?v=9">
            <!-- VERSIÓN ESCRITORIO / TABLETS (pantallas mayores a 768px) -->
            <img
                src="assets/banners/amsoil-cr-completo-en-construccion.jpg?v=9"
                alt="AMSOIL Costa Rica — En Construcción"
                class="showcase-img"
                width="1920"
                height="1580"
                loading="eager"
            >
        </picture>
    </main>

</body>
</html>
