<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMSOIL Costa Rica | En Construcción</title>
    <meta name="description" content="Sitio oficial de AMSOIL Costa Rica (American Lubricants Supply S.A.). Próximamente disponible.">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #06080B;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
            background-image: 
                radial-gradient(circle at 50% 15%, rgba(0, 80, 158, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 50% 85%, rgba(227, 24, 55, 0.1) 0%, transparent 60%),
                linear-gradient(180deg, #080A0D 0%, #030406 100%);
        }

        .masterpiece-showcase {
            width: 100%;
            max-width: 1100px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 
                0 25px 65px rgba(0, 0, 0, 0.9),
                0 0 0 1px rgba(255, 255, 255, 0.12),
                0 0 45px rgba(0, 80, 158, 0.25);
            background: #000000;
            transition: box-shadow 0.3s ease;
        }
        .masterpiece-showcase:hover {
            box-shadow: 
                0 30px 75px rgba(0, 0, 0, 0.95),
                0 0 0 1px rgba(255, 255, 255, 0.2),
                0 0 55px rgba(227, 24, 55, 0.3);
        }

        .masterpiece-img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <main class="masterpiece-showcase">
        <img 
            src="assets/banners/amsoil-cr-completo-en-construccion.jpg?v=5" 
            alt="AMSOIL Costa Rica - En Construcción"
            class="masterpiece-img"
            width="1920"
            height="1590"
        >
    </main>

</body>
</html>
