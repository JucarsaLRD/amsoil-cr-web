<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMSOIL Costa Rica | En Construcción</title>
    <meta name="description" content="Sitio oficial de AMSOIL Costa Rica (American Lubricants Supply S.A.). Próximamente disponible.">
    <style>
        :root {
            --amsoil-red: #CC262F;
            --amsoil-blue: #004B87;
            --amsoil-dark: #0F1416;
            --amsoil-charcoal: #1C2329;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background-color: var(--amsoil-dark);
            overflow-x: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        /* ANCHO TOTAL DE LA PANTALLA (EDGE TO EDGE - 100% FULL WIDTH) */
        .fullwidth-showcase {
            width: 100%;
            margin: 0;
            padding: 0;
            display: block;
        }

        .fullwidth-img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            vertical-align: middle;
        }
    </style>
</head>
<body>

    <main class="fullwidth-showcase">
        <img 
            src="assets/banners/amsoil-cr-completo-en-construccion.jpg?v=8" 
            alt="AMSOIL Costa Rica - En Construcción"
            class="fullwidth-img"
            width="1920"
            height="1580"
        >
    </main>

</body>
</html>
