<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" width="240" height="260">
  <defs>
    <linearGradient id="bottleBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E2428"/>
      <stop offset="22%" stop-color="#2E353B"/>
      <stop offset="55%" stop-color="#0F1416"/>
      <stop offset="88%" stop-color="#090C0E"/>
      <stop offset="100%" stop-color="#1E2428"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#CC262F"/>
      <stop offset="45%" stop-color="#FF3B44"/>
      <stop offset="100%" stop-color="#8E151B"/>
    </linearGradient>
    <linearGradient id="labelBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#181D20"/>
      <stop offset="100%" stop-color="#0B0E10"/>
    </linearGradient>
  </defs>
  <ellipse cx="120" cy="244" rx="64" ry="8" fill="rgba(15,20,22,0.22)"/>
  <!-- Cap with ridges -->
  <rect x="92" y="8" width="38" height="20" rx="2" fill="#CC262F" stroke="#0F1416" stroke-width="1"/>
  <line x1="98" y1="9" x2="98" y2="27" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
  <line x1="106" y1="9" x2="106" y2="27" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
  <line x1="114" y1="9" x2="114" y2="27" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
  <line x1="122" y1="9" x2="122" y2="27" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
  <!-- 3D Molded Quart Bottle Body -->
  <path d="M92 28 L80 64 C64 84 60 102 60 130 L60 224 C60 235 68 242 82 242 L158 242 C172 242 180 235 180 224 L180 100 C180 76 162 56 130 38 L128 28 Z" fill="url(#bottleBody)" stroke="#303233" stroke-width="1.5"/>
  <!-- Bottle 3D Specular Highlight -->
  <path d="M68 108 L68 222" stroke="rgba(255,255,255,0.12)" stroke-width="4" stroke-linecap="round"/>
  <!-- Label Container -->
  <rect x="70" y="90" width="100" height="136" rx="3" fill="url(#labelBg)" stroke="#2C73B7" stroke-width="2"/>
  <!-- White Top Header for Real AMSOIL Logo -->
  <polygon points="71,91 169,91 169,122 71,128" fill="#FFFFFF"/>
  <polygon points="71,128 169,122 169,138 71,144" fill="#2C73B7"/>
  <!-- REAL AMSOIL LOGO ON LABEL -->
  <image href="data:image/png;base64," x="77" y="93" width="86" height="30" preserveAspectRatio="xMidYMid meet"/>
  <!-- Series Title -->
  <text x="120" y="137" text-anchor="middle" fill="#FFFFFF" font-family="Arial Narrow, Impact, sans-serif" font-weight="800" font-size="9.5" letter-spacing="0.8">DIESEL INJECTOR CLEAN</text>
  <!-- Viscosity Grade -->
  <text x="120" y="176" text-anchor="middle" fill="#FFFFFF" font-family="Impact, Arial Black, sans-serif" font-weight="900" font-size="28" letter-spacing="0.5">+CETANE</text>
  <text x="120" y="192" text-anchor="middle" fill="#CACACD" font-family="Arial, sans-serif" font-weight="700" font-size="6.8" letter-spacing="0.5">HPCR COMMON-RAIL FORMULA</text>
  <!-- Bottom Spec Strip -->
  <rect x="76" y="200" width="88" height="15" rx="1" fill="#CC262F"/>
  <text x="120" y="210" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="800" font-size="7.5" letter-spacing="0.6">UP TO +8 CETANE BOOST</text>
  <text x="120" y="222" text-anchor="middle" fill="#888D91" font-family="Arial, sans-serif" font-weight="700" font-size="5.5">1 U.S. QUART • 946 mL</text>
</svg>